name: Build OpenWrt MSG2100-UPON-AC

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git rsync wget unzip \
            libncurses-dev libssl-dev libelf-dev file \
            python3 python3-pip python3-setuptools \
            zlib1g-dev quilt bc time subversion \
            libgmp-dev libmpc-dev libmpfr-dev \
            patchutils diffutils perl sed coreutils xz-utils

      - name: Clone OpenWrt
        run: |
          git clone --depth=1 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git log --oneline -3

      - name: Add econet-xpon package (PR #24577)
        run: |
          cd openwrt
          git clone --depth=1 -b econet-xpon-gpon https://github.com/AKoo7/openwrt.git /tmp/pr24577 2>&1 | tail -1
          cp -r /tmp/pr24577/package/kernel/econet-xpon package/kernel/
          mkdir -p package/kernel/econet-eth/patches
          cp /tmp/pr24577/package/kernel/econet-eth/patches/100-xpon-bench-spike.patch package/kernel/econet-eth/patches/
          ls package/kernel/econet-xpon/Makefile

      - name: Add device
        run: |
          cd openwrt
          mkdir -p target/linux/econet/dts
          cp ../en7528_raisecom_msg2100-upon-ac.dts target/linux/econet/dts/
          cat ../msg2100-device.mk >> target/linux/econet/image/en7528.mk
          # 修复 timer 块映射 bug (EN7528 4 VPE 启动时 membase[1] NULL panic)
          cp ../102-timer-fix-block-mapping.patch target/linux/econet/patches-6.18/
          # 覆盖默认网络配置: LAN 口(lan1-4)进网桥而非 eth0 (DSA)
          mkdir -p target/linux/econet/base-files/etc/config
          cp ../msg2100-network target/linux/econet/base-files/etc/config/network
          grep -A14 "raisecom_msg2100-upon-ac" target/linux/econet/image/en7528.mk

      - name: Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt
          echo "CONFIG_TARGET_econet=y" > .config
          echo "CONFIG_TARGET_econet_en7528=y" >> .config
          echo "CONFIG_TARGET_econet_en7528_DEVICE_raisecom_msg2100-upon-ac=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y" >> .config
          make defconfig
          grep -E "raisecom|CONFIG_TARGET_econet" .config | head -10

      - name: Build
        run: |
          cd openwrt
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Build econet-xpon ipk (standalone, not in image)
        run: |
          cd openwrt
          # 单独编译 xpon 驱动生成 .ipk，便于独立安装测试（不编进主镜像，风险最小）
          make package/kernel/econet-xpon/compile V=s 2>&1 | tee -a build.log || echo "XPON_BUILD_FAILED"
          find bin/packages -name "*econet-xpon*" 2>/dev/null

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-msg2100
          path: |
            openwrt/bin/targets/econet/en7528/*.trx
            openwrt/bin/targets/econet/en7528/*initramfs*
            openwrt/bin/targets/econet/en7528/*.bin
            openwrt/bin/packages/mipsel_24kc/kernel/*econet-xpon*.ipk
            openwrt/build.log
            openwrt/.config
          if-no-files-found: error
